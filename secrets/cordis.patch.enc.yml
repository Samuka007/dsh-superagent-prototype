patch:
    - id: webserver
      config:
        host: 127.0.0.1
        port: 3082
    - id: dsh-superagent
      config:
        stateDir: /home/superagent/.dsh-state
    - id: llm-pi-ai
      config:
        providers:
            newapi:
                displayName: NewAPI relay
                apiKeyEnv: NEWAPI_API_KEY
