                    - id: glm-5.3-flash
                      name: GLM 5.3 Flash
                      contextWindow: 128000
    - id: agent-default-model
      config:
        provider: newapi
        model: glm-5.3-flash
    - id: web-search-deepseek
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
